<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Админ-панель</title>
        <link rel="stylesheet" href="./styles/admin/admin.css">
        <link rel="icon" type="image/png" href="https://travelline.tech/favicon-96x96.png" sizes="96x96">
    </head>
    <body>
        <h1>Админ-панель</h1>

        <table>
            <thead>
                <tr>
                    <th></th>
                    <th style="width:100px">Тип</th>
                    <th>Значение</th>
                    <th>Подпись</th>
                    <th style="width:170px">Действия</th>
                </tr>
            </thead>
            <tbody id="items"></tbody>
        </table>

        <div class="add-form">
            <h3>Добавить элемент</h3>
            <div class="grid">
                <div>
                    <label>Тип</label>
                    <select id="new-type">
                        <option value="text">text</option>
                        <option value="img">img</option>
                    </select>
                </div>
                <div>
                    <label>Значение</label>
                    <input id="new-value" placeholder="300+ или путь к картинке">
                </div>
                <div>
                    <label>Подпись</label>
                    <input id="new-label" placeholder="сотрудников в техотделе">
                </div>
            </div>
            <p><button onclick="addItem()">Добавить</button></p>
        </div>

        <script src="./scripts/admin.js"></script>
    </body>
</html>
